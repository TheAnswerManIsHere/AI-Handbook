# Where every repository identity in the machinery comes from, by WHAT IT READS.
#
# CHECKED BY MACHINE, CLASSIFIED BY HAND. `scripts/check-identity-sources.mjs`
# walks the payload for identity touchpoints and fails unless each appears
# here with a `source` it recognises. A NEW touchpoint fails the build until
# someone answers for it; a vanished one fails too.
#
# THE RULE THIS FILE MAKES CHECKABLE. Identity comes from ONE config read
# (.agents/machinery.json, working tree), is STAMPED into every artifact the
# machinery mints, and is COMPARED on every artifact it consumes -- to the
# config, or on the guard path (which cannot afford a throw) to the budget
# that was stamped from it. GitHub's word is compared to config too, so a
# snapshot of the wrong PR is refused. That is the whole design.
#
# THE THREAT MODEL IS A MISTAKE, NOT AN ADVERSARY. The first version of this
# file graded each read by trust -- base commit over durable ref over working
# tree -- defending against an actor who can edit this checkout. That actor
# is the person running the script, who needs no exploit. The controls
# against deliberate action are David's merge and the server-side ruleset.
# (.agents/memory/machinery-threat-model-is-my-own-mistakes.md)
#
# SOURCES:
#   config      .agents/machinery.json, through the one reader
#   artifact    a receipt, budget or record the machinery itself wrote
#   github      GitHub's own word: a captured snapshot, or an Actions env var
#   tool-input  the repository the outgoing call itself names
#   message     text a human reads; decides nothing
#
# WHAT THE CHECK CANNOT DO. It keys on the line, so a touchpoint whose
# behaviour changes while its text stays the same does not fail. It matches
# the spellings in PATTERNS, so an identity arriving some other way is
# invisible. Neither is a trust boundary and neither is claimed as one.
#
# Keys are JSON-encoded because they quote lines of source containing `:: `,
# `"` and `'`. That keeps this file a strict subset of valid YAML.


