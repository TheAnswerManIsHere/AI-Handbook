name: Check

# The whole gate for this repo. There is no product build here — what can
# actually break is the machinery's behaviour and the manifest's coverage, so
# those are what run.
#
# Both jobs are named so they can be added to the branch ruleset's required
# status checks. Adding them there is a one-time repo setting, not something
# this file can do.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to a PR makes the first run's answer irrelevant, so cancel it.
# Runs on main are not cancelled: each one is the record for a distinct commit.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No install step: the machinery is deliberately dependency-free, and
      # keeping it that way is why this line is a comment rather than an
      # `npm ci`. If a dependency ever becomes necessary, that is a decision
      # to make explicitly, not by adding it here quietly.
      # The glob is required, not stylistic: Node 22 resolves a bare directory
      # argument to `--test` as a MODULE path and dies with MODULE_NOT_FOUND
      # before running anything. It fails as "1 test, 1 failed", which reads
      # like a real test failure rather than a bad invocation.
      - name: Run machinery tests
        run: node --test scripts/__tests__/*.test.mjs

      # The payload is code, and until this ran it was code nobody tested here:
      # a regression in the review-budget, receipt, guard or readiness scripts
      # could merge behind a green Test job because the step above only covers
      # this repo's own 33-test manifest suite.
      #
      # One file is excluded, by name rather than by skipping the suite:
      # check-contract-consistency.test.mjs asserts the scanned corpus contains
      # CLAUDE.md at the corpus root. That is true in a consumer and false here,
      # where the contract is deliberately split into a vendored core plus an
      # overlay. It is the second half of the `machinery` group's blocker, and
      # it is a fact about this repo's layout, not a failing behaviour.
      - name: Run payload machinery tests
        run: |
          node --test $(ls core/scripts/__tests__/*.test.mjs \
            | grep -v 'check-contract-consistency.test.mjs')

      # An exclusion with no expiry is how a temporary carve-out becomes
      # permanent. This asserts the exclusion is still EARNED: when the
      # machinery PR makes the contract surface configurable, that test starts
      # passing, this step goes red, and the carve-out above gets deleted in
      # the same change rather than outliving its reason.
      - name: The excluded test is still failing for the documented reason
        run: |
          if node --test core/scripts/__tests__/check-contract-consistency.test.mjs; then
            echo "::error::check-contract-consistency now passes in this layout."
            echo "The machinery blocker it documents is resolved — delete this step"
            echo "and the grep -v exclusion above, so the file runs with the rest."
            exit 1
          fi
          echo "Still failing as documented; the exclusion above remains earned."

  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check payload coverage
        run: node scripts/check-manifest.mjs
