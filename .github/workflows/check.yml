name: Check

# The whole gate for this repo. There is no product build here — what can
# actually break is the machinery's behaviour and this repo's wiring to its own
# payload, so those are what run.
#
# Both jobs are named so they can be added to the branch ruleset's required
# status checks. Adding them there is a one-time repo setting, not something
# this file can do.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to a PR makes the first run's answer irrelevant, so cancel it.
# Runs on main are not cancelled: each one is the record for a distinct commit.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No install step: the machinery is deliberately dependency-free, and
      # keeping it that way is why this line is a comment rather than an
      # `npm ci`. If a dependency ever becomes necessary, that is a decision
      # to make explicitly, not by adding it here quietly.
      # The glob is required, not stylistic: Node 22 resolves a bare directory
      # argument to `--test` as a MODULE path and dies with MODULE_NOT_FOUND
      # before running anything. It fails as "1 test, 1 failed", which reads
      # like a real test failure rather than a bad invocation.
      - name: Run machinery tests
        run: node --test scripts/__tests__/*.test.mjs

      # The payload is code, and until this ran it was code nobody tested here:
      # a regression in the review-budget, receipt, guard or readiness scripts
      # could merge behind a green Test job because the step above only covers
      # this repo's own root-level suite.
      #
      # One file is excluded, by name rather than by skipping the suite:
      # check-contract-consistency.test.mjs asserts the scanned corpus contains
      # CLAUDE.md at the corpus root. That is true in a consumer and false here,
      # where the contract is deliberately split into a vendored core plus an
      # overlay. It is a fact about this repo's layout, not a failing
      # behaviour. (It was also half of the old `machinery` group's blocker;
      # groups and blockers are gone, the exclusion and its reason are not.)
      - name: Run payload machinery tests
        run: |
          node --test $(ls core/scripts/__tests__/*.test.mjs \
            | grep -v 'check-contract-consistency.test.mjs')

      # An exclusion with no expiry is how a temporary carve-out becomes
      # permanent. This asserts the exclusion is still EARNED: when the
      # machinery PR makes the contract surface configurable, that test starts
      # passing, this step goes red, and the carve-out above gets deleted in
      # the same change rather than outliving its reason.
      - name: The excluded test is still failing for the documented reason
        run: |
          # "Did it fail?" is not the question — a nonzero exit proves nothing
          # about WHICH assertion failed. An unrelated regression in this file
          # would exit nonzero too, and a version of this step that only
          # checked the exit code would report the exclusion as earned while
          # waving that regression through. So assert the exact shape: one
          # failure, and it is the documented corpus-layout assertion.
          set +e
          out=$(node --test core/scripts/__tests__/check-contract-consistency.test.mjs 2>&1)
          status=$?
          set -e
          echo "$out" | tail -20

          if [ $status -eq 0 ]; then
            echo "::error::check-contract-consistency now passes in this layout."
            echo "The machinery blocker it documents is resolved — delete this step"
            echo "and the grep -v exclusion above, so the file runs with the rest."
            exit 1
          fi

          fails=$(echo "$out" | sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p')
          if [ "$fails" != "1" ]; then
            echo "::error::Expected exactly 1 failure in the excluded file, got '${fails:-unknown}'."
            echo "Something beyond the documented layout assertion is failing here."
            exit 1
          fi
          if ! echo "$out" | grep -q "not scanned: CLAUDE.md"; then
            echo "::error::The excluded file fails, but NOT for the documented reason."
            echo "Expected the 'not scanned: CLAUDE.md' corpus-layout assertion."
            echo "A different failure in an excluded file is a regression nobody is running."
            exit 1
          fi
          echo "Failing for exactly the documented reason; the exclusion remains earned."

  manifest:
    name: Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # NOTE ON THIS JOB'S NAME. It is called `Manifest` and there is no
      # longer a manifest. The name is load-bearing anyway: it is a REQUIRED
      # status check in `.agents/machinery.json` and in the branch ruleset, so
      # renaming it here would mean the required check never reports and every
      # PR blocks until the ruleset is edited. Renaming it is a settings change
      # David makes, not a code change, and it is deliberately not bundled in.
      #
      # Payload coverage used to run here, asking whether every file under
      # core/ was routed by sync-manifest.yml. The sync now routes core/**
      # by construction, so there is nothing a file can fall out of -- the
      # check became vacuous rather than needing a replacement. What could
      # still go wrong (two payload files colliding on one destination, a
      # seed failing to land) is covered by scripts/__tests__/sync.test.mjs
      # in the Test job.

      # Every place a repository identity enters a decision, classified.
      #
      # This runs in the Manifest job rather than Test because it is the same
      # kind of check: a claim about the payload that a human would otherwise
      # be asked to make from memory. Across nine review rounds on PR #7, six
      # confident descriptions of where identity comes from were published and
      # disproved — two of them measured before publishing. This reads the
      # code instead.
      - name: Check identity sources
        run: node scripts/check-identity-sources.mjs

      # Does this repo actually reach its own payload?
      #
      # The skills under core/.claude/ are written to be vendored into a
      # consumer; in the handbook they sit one directory too deep, so a session
      # working ON the handbook had the core rules but none of the skills those
      # rules invoke. Per-entry symlinks fix that with ONE copy, and adding a
      # skill to the payload is then only half the change -- the sync side of
      # that failure is now impossible by construction (core/** ships whole),
      # but the root-wiring side is not, which is why this check remains.
      - name: Check root wiring
        run: node scripts/check-root-wiring.mjs

      # Would Claude Code actually load these settings files?
      #
      # Its validator refuses a settings file carrying an unrecognised
      # top-level field, and is stricter than its own published schema -- which
      # declares "additionalProperties": {} and would permit unknown keys. So a
      # field can be valid JSON, allowed by the schema, and still rejected.
      #
      # A refused file installs no `hooks` block, which means no guard, with
      # nothing saying so. `settings-template` is mode: seed and lands as a
      # consumer's real .claude/settings.json, so the template is the file that
      # carries that cost. Both settings files once documented themselves in a
      # `_comment` array -- exactly the field the validator rejects.
      #
      # Sits in Manifest beside the other two for the reason they do: it is a
      # claim about the payload a human would otherwise make from memory, and
      # this reads the files instead.
      - name: Check settings fields
        run: node scripts/check-settings-fields.mjs

      # Does the sync actually run?
      #
      # Everything above imports the module; nothing exercised the CLI, so a
      # regression in argument handling, the self-sync refusal, or the payload
      # materialization could merge behind a green board while the unit suite
      # passed. AGENTS.md listed this command among those that run in the
      # required checks, and that was false until this step existed.
      #
      # A dry run writes nothing, so it is safe to point at a scratch
      # directory; what it proves is that the entry point still works.
      - name: Sync dry-run reaches a consumer
        run: |
          dest="$(mktemp -d)"
          node scripts/sync.mjs --to "$dest" --dry-run
          if [ -n "$(find "$dest" -type f)" ]; then
            echo "::error::a dry run wrote files into $dest"
            exit 1
          fi

      # Does the contract that loads into every session still fit its budget?
      #
      # The budget itself is enforced by the unit test in the Test job, which
      # calls the same function this CLI does. What THIS step adds is that the
      # entry point still runs: #54 shipped a script whose CLI no job exercised,
      # so a regression in argument handling or root resolution could merge
      # behind a green board while the unit suite passed.
      - name: Check contract budgets
        run: node core/scripts/check-claude-md-budget.mjs

      # The provenance-enabling gate was deleted with the staging system.
      # It asked whether a consumer would receive the provenance PARSER before
      # the documents that teach an author what to write -- a question only
      # meaningful while groups could ship separately. The payload now ships
      # whole, so the parser and its producer documents always arrive in the
      # same copy and the ordering hazard cannot occur.
      #
      # The invariant that DOES survive -- that the producer documents and the
      # parser agree about the declaration format -- was never this gate's job.
      # It is scripts/__tests__/plan-provenance-producers.test.mjs, which still
      # runs in the Test job.
